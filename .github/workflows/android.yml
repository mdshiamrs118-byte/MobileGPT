name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:   # lets you run it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: App   # the Gradle project lives in the App/ folder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The repo has no gradlew script, so install Gradle directly.
      # AGP 8.0.1 needs Gradle 8.0+.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.0.2

      # local.properties from the original machine points to a Mac SDK path
      - name: Remove local.properties
        run: rm -f local.properties app/local.properties

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileGPT-debug-apk
          path: App/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
